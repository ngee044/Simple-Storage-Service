version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: s3-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s3-network

  redis:
    image: redis:7-alpine
    container_name: s3-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s3-network

  postgres:
    image: postgres:15-alpine
    container_name: s3-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: s3_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../S3MetaDB/S3MetaDB.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d s3_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s3-network

  rest-api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.restapi
    container_name: s3-rest-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      RABBITMQ_DSN: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: request_message
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
      SERVER_PORT: "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - s3-network

  core-service:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.core
    container_name: s3-core-service
    volumes:
      - storage_data:/app/storage
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - s3-network

networks:
  s3-network:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  storage_data:
